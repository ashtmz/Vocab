<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="application-name" content="Vocab">
<meta name="theme-color" content="#0a0c12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Vocab</title>
<style>
  :root {
    --bg: #0a0c12;
    --text: #eef1f8;
    --sub: #98a0b3;
    --accent: #8b5cf6;
    --accent2: #22d3ee;
    --correct: #22c55e;
    --wrong: #fb4d6d;
    --line: rgba(255, 255, 255, 0.09);
    --glass: rgba(255, 255, 255, 0.05);
    --glow: 0 0 24px rgba(139, 92, 246, 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { touch-action: manipulation; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }
  /* 背景の発光グロー */
  body::before, body::after {
    content: "";
    position: fixed; z-index: -1;
    width: 60vmax; height: 60vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.32;
    pointer-events: none;
  }
  body::before { top: -25vmax; left: -18vmax; background: radial-gradient(circle, #6d28d9, transparent 65%); }
  body::after  { bottom: -28vmax; right: -20vmax; background: radial-gradient(circle, #0e7490, transparent 65%); }

  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand .eyebrow {
    font-size: 0.68rem; letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--sub); margin-bottom: 6px;
  }
  h1 {
    display: inline-block;
    font-size: 1.6rem; font-weight: 800; letter-spacing: 0.08em;
    background: linear-gradient(90deg, #c4b5fd, #67e8f9);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  h2 {
    font-size: 0.72rem; margin-bottom: 14px; color: var(--sub);
    font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase;
  }

  /* ===== 画面遷移アニメーション ===== */
  .screen { animation: screenIn 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .panel {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: screenIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards;
  }
  .panel:nth-child(2) { animation-delay: 0.06s; }
  .panel:nth-child(3) { animation-delay: 0.12s; }
  .panel:nth-child(4) { animation-delay: 0.18s; }

  .btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    min-height: 48px;
    padding: 12px 10px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.055);
    color: var(--text);
    cursor: pointer;
    transition: transform 0.12s, background 0.18s, border-color 0.18s, box-shadow 0.18s, color 0.18s;
  }
  button:hover { border-color: rgba(139, 92, 246, 0.55); }
  button:active { transform: scale(0.94); }
  button.selected {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.92), rgba(34, 211, 238, 0.82));
    border-color: transparent; color: #0b0d14; font-weight: 700;
    box-shadow: var(--glow);
  }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent; color: #0b0d14; font-weight: 800;
    font-size: 1rem; padding: 14px 28px;
    letter-spacing: 0.05em;
    box-shadow: 0 8px 28px rgba(139, 92, 246, 0.45);
  }
  button.primary:not(:disabled):hover { filter: brightness(1.12); }
  button:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
  .flag { font-size: 1.3rem; display: block; margin-bottom: 4px; }

  /* ===== 進捗バー ===== */
  .progress-track {
    height: 6px; border-radius: 99px;
    background: rgba(255, 255, 255, 0.1);
    margin-bottom: 12px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 0 12px rgba(34, 211, 238, 0.7);
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .status-bar {
    display: flex; justify-content: space-between;
    color: var(--sub); font-size: 0.82rem;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }

  /* ===== フラッシュカード(3Dフリップ+スワイプ)===== */
  .card-stage { perspective: 1200px; margin-bottom: 16px; }
  .flashcard {
    position: relative;
    height: 300px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .flashcard.dragging { transition: none; }
  .flashcard.fly-right { transition: transform 0.35s ease-in; transform: translateX(120vw) rotate(20deg) !important; }
  .flashcard.fly-left  { transition: transform 0.35s ease-in; transform: translateX(-120vw) rotate(-20deg) !important; }
  .card-inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.34, 1.3, 0.5, 1);
  }
  .flashcard.flipped .card-inner { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    border-radius: 24px;
    background: linear-gradient(160deg, #1a1f2e, #12151f);
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    padding: 26px 22px; text-align: center;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .card-face.back {
    transform: rotateY(180deg);
    background: linear-gradient(160deg, #241d3d, #131a2b);
  }
  .flashcard[data-lean="right"] .card-face { border-color: var(--correct); box-shadow: 0 0 28px rgba(34, 197, 94, 0.35); }
  .flashcard[data-lean="left"] .card-face { border-color: var(--wrong); box-shadow: 0 0 28px rgba(251, 77, 109, 0.35); }
  .card-face .word {
    font-weight: 800; word-break: break-word; line-height: 1.2;
    letter-spacing: 0.02em;
  }
  .card-face .meaning {
    color: #c4b5fd; font-weight: 700; line-height: 1.65;
    max-height: 185px; overflow-y: auto;
    overscroll-behavior: contain;
    padding: 0 2px;
  }
  .card-face .meaning::-webkit-scrollbar { width: 4px; }
  .card-face .meaning::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 99px; }
  .card-face .hint { font-size: 0.75rem; color: var(--sub); letter-spacing: 0.12em; }
  .swipe-labels {
    display: flex; justify-content: space-between;
    color: var(--sub); font-size: 0.75rem;
    letter-spacing: 0.06em;
    margin-bottom: 10px; padding: 0 6px;
  }
  .card-counter {
    position: absolute; top: 16px; right: 20px;
    font-size: 0.72rem; color: var(--sub); letter-spacing: 0.12em;
  }

  /* ===== クイズ ===== */
  .quiz-word {
    font-weight: 800; text-align: center;
    margin: 10px 0 20px; color: var(--text);
    line-height: 1.4;
    text-shadow: 0 0 24px rgba(139, 92, 246, 0.5);
    word-break: break-word;
  }
  .quiz-word.pop { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  .choices { display: grid; gap: 10px; }
  .choices button {
    text-align: left; padding: 15px 16px; font-size: 0.95rem;
    line-height: 1.55;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    animation: choiceIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
  }
  .choices button:nth-child(1) { animation-delay: 0.05s; }
  .choices button:nth-child(2) { animation-delay: 0.12s; }
  .choices button:nth-child(3) { animation-delay: 0.19s; }
  .choices button:nth-child(4) { animation-delay: 0.26s; }
  @keyframes choiceIn {
    from { opacity: 0; transform: translateX(-24px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .choices button.correct {
    background: rgba(34, 197, 94, 0.18); border-color: var(--correct); color: #86efac;
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
    animation: pulse 0.45s ease;
  }
  .choices button.wrong {
    background: rgba(251, 77, 109, 0.16); border-color: var(--wrong); color: #fda4b6;
    box-shadow: 0 0 20px rgba(251, 77, 109, 0.3);
    animation: shake 0.45s ease;
  }
  @keyframes pulse {
    0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }

  /* ===== タイピング ===== */
  .typing-panel { animation: screenIn 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  input[type="text"] {
    width: 100%;
    font-size: 16px; /* iOSの自動ズーム防止のため16px以上 */
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 12px;
    font-family: inherit;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    caret-color: var(--accent2);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]::placeholder { color: var(--sub); }
  input[type="text"]:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.22);
  }
  input.input-ok { border-color: var(--correct) !important; box-shadow: 0 0 16px rgba(34,197,94,0.35) !important; animation: pulse 0.4s ease; }
  input.input-ng { border-color: var(--wrong) !important; box-shadow: 0 0 16px rgba(251,77,109,0.35) !important; animation: shake 0.45s ease; }
  .feedback { min-height: 1.7em; font-weight: 700; margin-bottom: 8px; font-size: 1.02rem; }
  .feedback.ok { color: #4ade80; }
  .feedback.ng { color: var(--wrong); }

  .controls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }

  /* ===== 結果画面 ===== */
  .result-panel { text-align: center; }
  .ring-wrap { position: relative; width: 160px; height: 160px; margin: 12px auto 8px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 12; }
  .ring-fg {
    fill: none; stroke: url(#ringGrad); stroke-width: 12; stroke-linecap: round;
    filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6));
    transition: stroke-dashoffset 1.1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .ring-label {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-label .rate { font-size: 2.3rem; font-weight: 800; }
  .ring-label .rate small { font-size: 1rem; color: var(--sub); }
  .result-msg { font-size: 1.1rem; font-weight: 700; margin: 6px 0 4px; }
  .result-sub { color: var(--sub); font-size: 0.9rem; margin-bottom: 14px; }

  /* ===== 紙吹雪 ===== */
  .confetti {
    position: fixed; top: -20px; width: 9px; height: 13px;
    z-index: 99; pointer-events: none; opacity: 0.95;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.55; }
  }

  /* ===== 学習記録 ===== */
  .stats-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .stats-table th, .stats-table td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  .stats-table th { color: var(--sub); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.14em; }
  .rate-bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 5px; }
  .rate-bar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .study-plan { text-align: center; }
  .study-plan .plan-main { font-size: 1.05rem; font-weight: 800; color: #c4b5fd; }
  .study-plan .plan-sub { margin-top: 7px; color: var(--sub); font-size: 0.82rem; line-height: 1.6; }

  .back-link {
    display: inline-flex; align-items: center; gap: 4px;
    margin-bottom: 12px; color: var(--sub); cursor: pointer; font-size: 0.85rem;
    letter-spacing: 0.06em; min-height: 44px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--text); }
  .hidden { display: none !important; }

  @media (max-width: 400px) {
    .btn-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="eyebrow">Spaced Repetition Vocabulary</div>
    <h1>Vocab</h1>
  </div>

  <!-- ホーム画面 -->
  <div id="home" class="screen">
    <div class="panel">
      <h2>Language / 言語</h2>
      <div class="btn-grid" id="langButtons"></div>
    </div>
    <div class="panel">
      <h2>Mode / 学習モード</h2>
      <div class="btn-grid" id="modeButtons">
        <button data-mode="flashcard"><span class="flag">🃏</span>フラッシュカード</button>
        <button data-mode="quiz"><span class="flag">📝</span>4択クイズ</button>
        <button data-mode="typing"><span class="flag">⌨️</span>タイピング</button>
      </div>
    </div>
    <div class="panel">
      <h2>Level / レベル(頻出順)</h2>
      <div class="btn-grid" id="levelButtons"></div>
    </div>
    <div class="controls">
      <button class="primary" id="startBtn" disabled>学習を始める</button>
    </div>
    <div class="panel study-plan" style="margin-top: 16px;">
      <h2>Today's plan / 今日の学習</h2>
      <div id="studyPlan"></div>
    </div>
    <div class="panel" style="margin-top: 16px;">
      <h2>Stats / 学習記録</h2>
      <table class="stats-table" id="statsTable"></table>
      <div class="controls">
        <button id="resetBtn">記録をリセット</button>
      </div>
    </div>
  </div>

  <!-- 学習画面 -->
  <div id="study" class="screen hidden">
    <span class="back-link" id="backLink">← ホームに戻る</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status-bar">
      <span id="progressLabel"></span>
      <span id="scoreLabel"></span>
    </div>

    <!-- フラッシュカード -->
    <div id="flashcardView" class="hidden">
      <div class="swipe-labels"><span>← まだ ✕</span><span>タップで意味を表示</span><span>覚えた ○ →</span></div>
      <div class="card-stage">
        <div class="flashcard" id="cardEl">
          <div class="card-inner">
            <div class="card-face front">
              <span class="card-counter" id="cardCounter"></span>
              <div class="word" id="cardWord"></div>
              <div class="hint">タップして意味を表示</div>
            </div>
            <div class="card-face back">
              <div class="meaning" id="cardMeaning"></div>
              <div class="hint">スワイプ、またはボタンで判定</div>
            </div>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="dontKnowBtn" style="min-width: 130px;">まだ ✕</button>
        <button id="knowBtn" class="primary" style="min-width: 130px;">覚えた ○</button>
      </div>
    </div>

    <!-- 4択クイズ -->
    <div id="quizView" class="hidden">
      <div class="quiz-word" id="quizWord"></div>
      <div class="choices" id="quizChoices"></div>
      <div class="controls">
        <button id="quizNextBtn" class="primary hidden">次へ →</button>
      </div>
    </div>

    <!-- タイピング -->
    <div id="typingView" class="hidden">
      <div class="quiz-word" id="typingMeaning"></div>
      <div class="panel typing-panel">
        <div class="feedback" id="typingFeedback"></div>
        <input type="text" id="typingInput" placeholder="スペルを入力して Enter" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="controls">
          <button id="typingSubmitBtn" class="primary">答える</button>
          <button id="typingSkipBtn">わからない</button>
        </div>
      </div>
    </div>

    <!-- 結果 -->
    <div id="resultView" class="hidden">
      <div class="panel result-panel">
        <h2>Result / 結果</h2>
        <div class="ring-wrap">
          <svg width="160" height="160" viewBox="0 0 160 160">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#8b5cf6"/>
                <stop offset="100%" stop-color="#22d3ee"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="80" cy="80" r="65"/>
            <circle class="ring-fg" id="ringFg" cx="80" cy="80" r="65"/>
          </svg>
          <div class="ring-label">
            <div class="rate"><span id="rateNum">0</span><small>%</small></div>
          </div>
        </div>
        <div class="result-msg" id="resultMsg"></div>
        <div class="result-sub" id="resultDetail"></div>
        <div class="result-sub" id="resultReview"></div>
        <div class="controls">
          <button class="primary" id="retryBtn">もう一度</button>
          <button id="homeBtn">ホームへ</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="words.js"></script>
<script>
// 単語データは words.js(自動生成・頻度順)で定義される

const MODE_NAMES = { flashcard: "フラッシュカード", quiz: "4択クイズ", typing: "タイピング" };
const LANG_FLAGS = { en: "🇺🇸", es: "🇪🇸", fr: "🇫🇷", de: "🇩🇪", it: "🇮🇹" };
const SESSION_SIZE = 10; // 1回の学習で出題する単語数
const NEW_WORDS_PER_DAY = 10;
const DAY_MS = 24 * 60 * 60 * 1000;
const STORAGE_KEY = "vocabAppStats";
const CARD_STORAGE_KEY = "vocabAppCards";
// 頻度順のレベル区分(start以上end未満のインデックス)
const LEVELS = [
  { name: "初級", start: 0, end: 1000 },
  { name: "中級", start: 1000, end: 3000 },
  { name: "上級", start: 3000, end: 6000 },
  { name: "最上級", start: 6000, end: 10000 }
];

// ===== 状態 =====
let selectedLang = null;
let selectedMode = null;
let selectedLevel = 0;
let session = { words: [], index: 0, correct: 0, attempted: 0, initialTotal: 0, missed: new Set() };

// 選択中の言語・レベルに応じた出題範囲を返す
function currentPool() {
  const { start, end } = LEVELS[selectedLevel];
  return WORDS[selectedLang].list.slice(start, end);
}

// ===== 文字数に応じたフォントサイズ調整(省略表示を防ぐ)=====
const WORD_SIZES    = [[8, "2.6rem"], [12, "2.1rem"], [18, "1.7rem"], [Infinity, "1.35rem"]];
const MEANING_SIZES = [[14, "1.4rem"], [26, "1.18rem"], [46, "1.04rem"], [70, "0.95rem"], [Infinity, "0.88rem"]];
const QUIZ_SIZES    = [[10, "2.1rem"], [16, "1.7rem"], [24, "1.4rem"], [Infinity, "1.15rem"]];
const TYPING_SIZES  = [[14, "1.8rem"], [26, "1.4rem"], [46, "1.15rem"], [70, "1rem"], [Infinity, "0.9rem"]];
function fitFont(el, text, steps) {
  for (const [max, size] of steps) {
    if (text.length <= max) { el.style.fontSize = size; return; }
  }
}

// ===== 学習記録(localStorage)=====
function loadStats() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

// 単語ごとの間隔反復データ。既存の言語別集計とは別に保存する。
function loadCards() {
  try {
    const data = JSON.parse(localStorage.getItem(CARD_STORAGE_KEY));
    return data && typeof data === "object" ? data : {};
  } catch { return {}; }
}
function saveCards(cards) {
  localStorage.setItem(CARD_STORAGE_KEY, JSON.stringify(cards));
}
function cardKey(lang, word) {
  return `${lang}:${word.normalize("NFC").toLowerCase()}`;
}
function startOfToday() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
}
function reviewedNewWordsToday(lang) {
  const start = startOfToday();
  return Object.values(loadCards()).filter(c => c.lang === lang && c.firstSeenAt >= start).length;
}
function recordReview(word, correct) {
  const cards = loadCards();
  const key = cardKey(selectedLang, word);
  const previous = cards[key] || {
    lang: selectedLang, word, firstSeenAt: Date.now(), reviews: 0,
    repetitions: 0, lapses: 0, intervalDays: 0
  };
  const now = Date.now();
  const card = { ...previous, lastReviewedAt: now, reviews: previous.reviews + 1 };
  if (correct) {
    // 1日 → 3日 → 以降は約2.5倍。間違い後は翌日から再スタートする。
    const interval = previous.intervalDays <= 0 ? 1
      : previous.intervalDays === 1 ? 3
      : Math.min(180, Math.round(previous.intervalDays * 2.5));
    card.repetitions = previous.repetitions + 1;
    card.intervalDays = interval;
    card.dueAt = now + interval * DAY_MS;
  } else {
    card.repetitions = 0;
    card.lapses = previous.lapses + 1;
    card.intervalDays = 0;
    card.dueAt = now;
  }
  cards[key] = card;
  saveCards(cards);
}
function currentProgress(word, cards) {
  return (cards || loadCards())[cardKey(selectedLang, word)];
}
function renderStudyPlan() {
  const el = document.getElementById("studyPlan");
  if (!selectedLang) {
    el.innerHTML = `<div class="plan-main">言語を選ぶと今日の復習数を表示します</div>`;
    return;
  }
  const now = Date.now();
  const savedCards = loadCards();
  const cards = currentPool().map(([word]) => currentProgress(word, savedCards)).filter(Boolean);
  const due = cards.filter(c => c.dueAt <= now).length;
  const weak = cards.filter(c => c.lapses >= 2).length;
  const newLeft = Math.max(0, NEW_WORDS_PER_DAY - reviewedNewWordsToday(selectedLang));
  el.innerHTML = due
    ? `<div class="plan-main">今日の復習：${due}語</div><div class="plan-sub">復習語を優先して出題します。新規はあと${newLeft}語まで。</div>`
    : `<div class="plan-main">復習待ちの単語はありません</div><div class="plan-sub">今日は新規を${newLeft}語まで学べます${weak ? ` ・ 苦手語 ${weak}語` : ""}</div>`;
}
function saveResult(lang, correct, total) {
  const stats = loadStats();
  if (!stats[lang]) stats[lang] = { sessions: 0, correct: 0, total: 0 };
  stats[lang].sessions++;
  stats[lang].correct += correct;
  stats[lang].total += total;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
  renderStats();
  renderStudyPlan();
}
function renderStats() {
  const stats = loadStats();
  const table = document.getElementById("statsTable");
  const rows = Object.keys(WORDS)
    .filter(k => stats[k])
    .map(k => {
      const s = stats[k];
      const rate = s.total ? Math.round(s.correct / s.total * 100) : 0;
      return `<tr><td>${LANG_FLAGS[k] || ""} ${WORDS[k].name}</td><td>${s.sessions}回</td><td>${s.correct}/${s.total}問</td>` +
             `<td style="min-width:70px;">${rate}%<div class="rate-bar"><div style="width:${rate}%"></div></div></td></tr>`;
    });
  table.innerHTML = rows.length
    ? `<tr><th>言語</th><th>回数</th><th>正解</th><th>正答率</th></tr>` + rows.join("")
    : `<tr><td style="color: var(--sub);">まだ記録がありません</td></tr>`;
}

// ===== ユーティリティ =====
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function show(id) { document.getElementById(id).classList.remove("hidden"); }
function hide(id) { document.getElementById(id).classList.add("hidden"); }
function replayAnim(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth; // アニメーション再生のためリフローを挟む
  el.classList.add(cls);
}

// ===== ホーム画面のセットアップ =====
const langButtonsEl = document.getElementById("langButtons");
for (const key of Object.keys(WORDS)) {
  const btn = document.createElement("button");
  btn.innerHTML = `<span class="flag">${LANG_FLAGS[key] || "🌐"}</span>${WORDS[key].name}`;
  btn.addEventListener("click", () => {
    selectedLang = key;
    langButtonsEl.querySelectorAll("button").forEach(b => b.classList.toggle("selected", b === btn));
    updateStartBtn();
    renderStudyPlan();
  });
  langButtonsEl.appendChild(btn);
}
document.querySelectorAll("[data-mode]").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedMode = btn.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("selected", b === btn));
    updateStartBtn();
  });
});
const levelButtonsEl = document.getElementById("levelButtons");
LEVELS.forEach((lv, i) => {
  const btn = document.createElement("button");
  btn.textContent = `${lv.name} ${lv.start + 1}〜${lv.end}位`;
  if (i === selectedLevel) btn.classList.add("selected");
  btn.addEventListener("click", () => {
    selectedLevel = i;
    levelButtonsEl.querySelectorAll("button").forEach(b => b.classList.toggle("selected", b === btn));
    renderStudyPlan();
  });
  levelButtonsEl.appendChild(btn);
});
function updateStartBtn() {
  document.getElementById("startBtn").disabled = !(selectedLang && selectedMode);
}
document.getElementById("startBtn").addEventListener("click", startSession);
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("学習記録をすべて削除します。よろしいですか?")) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(CARD_STORAGE_KEY);
    renderStats();
    renderStudyPlan();
  }
});
document.getElementById("backLink").addEventListener("click", goHome);
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("retryBtn").addEventListener("click", startSession);

function goHome() {
  hide("study");
  const home = document.getElementById("home");
  home.classList.remove("hidden");
  replayAnim(home, "screen");
  renderStudyPlan();
}

// ===== セッション管理 =====
function selectSessionWords() {
  const now = Date.now();
  const cards = loadCards();
  const entries = currentPool().map(([word, meaning]) => ({ word, meaning, progress: currentProgress(word, cards) }));
  const due = entries
    .filter(item => item.progress && item.progress.dueAt <= now)
    .sort((a, b) => a.progress.dueAt - b.progress.dueAt);
  const newWords = shuffle(entries.filter(item => !item.progress));
  const upcoming = entries
    .filter(item => item.progress && item.progress.dueAt > now)
    .sort((a, b) => a.progress.dueAt - b.progress.dueAt);

  const selected = due.slice(0, SESSION_SIZE);
  const newSlots = Math.max(0, NEW_WORDS_PER_DAY - reviewedNewWordsToday(selectedLang));
  selected.push(...newWords.slice(0, Math.min(SESSION_SIZE - selected.length, newSlots)));
  // 復習も新規も残っていないときは、次に期限が来る語を自主練習として出す。
  selected.push(...upcoming.slice(0, SESSION_SIZE - selected.length));
  return shuffle(selected).map(item => ({ ...item, isRetry: false, retryCount: 0 }));
}
function startSession() {
  const words = selectSessionWords();
  session = {
    words,
    index: 0,
    correct: 0,
    attempted: 0,
    initialTotal: words.length,
    missed: new Set()
  };
  hide("home");
  const study = document.getElementById("study");
  study.classList.remove("hidden");
  replayAnim(study, "screen");
  ["flashcardView", "quizView", "typingView", "resultView"].forEach(hide);
  show(selectedMode + "View");
  nextQuestion();
}
function updateStatus() {
  const item = session.words[session.index];
  const isRetry = item && item.isRetry;
  document.getElementById("progressLabel").textContent =
    isRetry
      ? `${WORDS[selectedLang].name} / 苦手語の再確認`
      : `${WORDS[selectedLang].name} ${LEVELS[selectedLevel].name} / ${MODE_NAMES[selectedMode]}  ${session.attempted + 1} / ${session.initialTotal}問目`;
  document.getElementById("scoreLabel").textContent = session.attempted
    ? `正解 ${session.correct}/${session.attempted}`
    : "正解 0";
  document.getElementById("progressFill").style.width =
    `${Math.min(session.attempted / session.initialTotal, 1) * 100}%`;
}
function advance(wasCorrect) {
  const item = session.words[session.index];
  recordReview(item.word, wasCorrect);
  if (!item.isRetry) {
    session.attempted++;
    if (wasCorrect) session.correct++;
    else {
      session.missed.add(cardKey(selectedLang, item.word));
      // 数問後にもう一度だけ出し、答えを思い出す機会を作る。
      const retry = { ...item, isRetry: true, retryCount: item.retryCount + 1 };
      const retryAt = Math.min(session.index + 4, session.words.length);
      session.words.splice(retryAt, 0, retry);
    }
  } else if (!wasCorrect) {
    session.missed.add(cardKey(selectedLang, item.word));
  }
  session.index++;
  if (session.index >= session.words.length) {
    finishSession();
  } else {
    nextQuestion();
  }
}
function nextQuestion() {
  updateStatus();
  const { word, meaning } = session.words[session.index];
  if (selectedMode === "flashcard") renderFlashcard(word, meaning);
  else if (selectedMode === "quiz") renderQuiz(word, meaning);
  else renderTyping(word, meaning);
}
function finishSession() {
  ["flashcardView", "quizView", "typingView"].forEach(hide);
  show("resultView");
  document.getElementById("progressFill").style.width = "100%";
  const total = session.initialTotal;
  const rate = Math.round(session.correct / total * 100);
  document.getElementById("resultMsg").textContent =
    rate === 100 ? "🎉 全問正解!すばらしい!" : rate >= 70 ? "✨ いい調子!" : "💪 繰り返して覚えよう";
  document.getElementById("resultDetail").textContent = `${session.correct} / ${total} 問正解`;
  const missed = session.missed.size;
  document.getElementById("resultReview").textContent = missed
    ? `苦手だった ${missed} 語は、次回の復習に優先表示されます。`
    : "次の復習は、記憶が薄れ始める頃に出題されます。";
  // 正答率リングのアニメーション
  const circumference = 2 * Math.PI * 65;
  const ring = document.getElementById("ringFg");
  ring.style.transition = "none";
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = circumference;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    ring.style.transition = "";
    ring.style.strokeDashoffset = circumference * (1 - rate / 100);
  }));
  // スコアのカウントアップ
  const numEl = document.getElementById("rateNum");
  const t0 = performance.now();
  (function count(now) {
    const p = Math.min((now - t0) / 1000, 1);
    numEl.textContent = Math.round(rate * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(count);
  })(t0);
  if (rate >= 80) launchConfetti();
  saveResult(selectedLang, session.correct, total);
}

// ===== 紙吹雪 =====
function launchConfetti() {
  const colors = ["#8b5cf6", "#22d3ee", "#f472b6", "#4ade80", "#facc15", "#fb7185"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = 1.6 + Math.random() * 1.8 + "s";
    c.style.animationDelay = Math.random() * 0.6 + "s";
    c.style.borderRadius = Math.random() < 0.4 ? "50%" : "2px";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

// ===== フラッシュカード(タップでフリップ / スワイプで判定)=====
const cardEl = document.getElementById("cardEl");
function renderFlashcard(word, meaning) {
  cardEl.classList.remove("flipped", "fly-right", "fly-left");
  cardEl.style.transform = "";
  cardEl.removeAttribute("data-lean");
  const wordEl = document.getElementById("cardWord");
  const meaningEl = document.getElementById("cardMeaning");
  wordEl.textContent = word;
  meaningEl.textContent = meaning;
  fitFont(wordEl, word, WORD_SIZES);
  fitFont(meaningEl, meaning, MEANING_SIZES);
  meaningEl.scrollTop = 0;
  document.getElementById("cardCounter").textContent = `${session.index + 1}/${session.words.length}`;
  // 登場アニメーション
  cardEl.animate(
    [{ opacity: 0, transform: "translateY(20px) scale(0.94)" }, { opacity: 1, transform: "translateY(0) scale(1)" }],
    { duration: 320, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
  );
}
function swipeOut(dir) {
  if (cardEl.classList.contains("fly-right") || cardEl.classList.contains("fly-left")) return;
  cardEl.classList.add(dir === "right" ? "fly-right" : "fly-left");
  setTimeout(() => advance(dir === "right"), 300);
}
// ポインタ操作(ドラッグ追従+閾値でスワイプ確定、僅かな移動はタップ=フリップ)
let drag = null;
cardEl.addEventListener("pointerdown", (e) => {
  if (cardEl.classList.contains("fly-right") || cardEl.classList.contains("fly-left")) return;
  drag = { x0: e.clientX, dx: 0 };
  cardEl.classList.add("dragging");
  cardEl.setPointerCapture(e.pointerId);
});
cardEl.addEventListener("pointermove", (e) => {
  if (!drag) return;
  drag.dx = e.clientX - drag.x0;
  cardEl.style.transform = `translateX(${drag.dx}px) rotate(${drag.dx / 22}deg)`;
  if (drag.dx > 45) cardEl.dataset.lean = "right";
  else if (drag.dx < -45) cardEl.dataset.lean = "left";
  else cardEl.removeAttribute("data-lean");
});
function endDrag() {
  if (!drag) return;
  const dx = drag.dx;
  drag = null;
  cardEl.classList.remove("dragging");
  cardEl.removeAttribute("data-lean");
  if (dx > 80) { swipeOut("right"); return; }
  if (dx < -80) { swipeOut("left"); return; }
  cardEl.style.transform = "";
  if (Math.abs(dx) < 8) cardEl.classList.toggle("flipped"); // タップ扱い
}
cardEl.addEventListener("pointerup", endDrag);
cardEl.addEventListener("pointercancel", endDrag);
document.getElementById("knowBtn").addEventListener("click", () => swipeOut("right"));
document.getElementById("dontKnowBtn").addEventListener("click", () => swipeOut("left"));

// ===== 4択クイズ =====
function renderQuiz(word, meaning) {
  const quizWord = document.getElementById("quizWord");
  quizWord.textContent = word;
  fitFont(quizWord, word, QUIZ_SIZES);
  replayAnim(quizWord, "pop");
  hide("quizNextBtn");
  const others = shuffle(currentPool().filter(([w, m]) => w !== word && m !== meaning)).slice(0, 3);
  const choices = shuffle([[word, meaning], ...others]);
  const container = document.getElementById("quizChoices");
  container.innerHTML = "";
  choices.forEach(([, m]) => {
    const btn = document.createElement("button");
    btn.textContent = m;
    btn.addEventListener("click", () => {
      const isCorrect = m === meaning;
      container.querySelectorAll("button").forEach(b => {
        b.disabled = true;
        if (b.textContent === meaning) b.classList.add("correct");
        else if (b === btn && !isCorrect) b.classList.add("wrong");
      });
      show("quizNextBtn");
      document.getElementById("quizNextBtn").dataset.result = isCorrect ? "1" : "0";
    });
    container.appendChild(btn);
  });
}
document.getElementById("quizNextBtn").addEventListener("click", (e) => {
  advance(e.target.dataset.result === "1");
});

// ===== タイピング =====
function normalize(s) {
  return s.trim().toLowerCase().normalize("NFC");
}
function renderTyping(word, meaning) {
  const meaningEl = document.getElementById("typingMeaning");
  meaningEl.textContent = meaning;
  fitFont(meaningEl, meaning, TYPING_SIZES);
  replayAnim(meaningEl, "pop");
  const fb = document.getElementById("typingFeedback");
  fb.textContent = "";
  fb.className = "feedback";
  const input = document.getElementById("typingInput");
  input.value = "";
  input.disabled = false;
  input.classList.remove("input-ok", "input-ng");
  document.getElementById("typingSubmitBtn").disabled = false;
  document.getElementById("typingSkipBtn").disabled = false;
  input.focus();
}
function checkTyping(skip) {
  const { word } = session.words[session.index];
  const input = document.getElementById("typingInput");
  const fb = document.getElementById("typingFeedback");
  if (input.disabled) return;
  const isCorrect = !skip && normalize(input.value) === normalize(word);
  fb.textContent = isCorrect ? "⭕ 正解!" : `❌ 正しくは「${word}」`;
  fb.className = "feedback " + (isCorrect ? "ok" : "ng");
  input.classList.add(isCorrect ? "input-ok" : "input-ng");
  input.disabled = true;
  document.getElementById("typingSubmitBtn").disabled = true;
  document.getElementById("typingSkipBtn").disabled = true;
  setTimeout(() => advance(isCorrect), 1200);
}
document.getElementById("typingSubmitBtn").addEventListener("click", () => checkTyping(false));
document.getElementById("typingSkipBtn").addEventListener("click", () => checkTyping(true));
document.getElementById("typingInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.target.disabled) checkTyping(false);
});

// 初期表示
renderStats();
renderStudyPlan();

// PWA: 一度開いた単語データと画面を端末に保存し、オフラインでも利用できるようにする。
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
